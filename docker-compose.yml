# voxlibris — un « docker compose up » doit suffire.
#
#   docker compose pull                                les images publiées, plutôt que
#                                                      les construire sur place
#   docker compose up                                  interface + atelier, sans GPU
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
#                                                      idem, avec la carte NVIDIA
#   docker compose --profile voxtral ... up            ajoute le serveur Voxtral local
#   docker compose --profile zonos2 ... up             ajoute le serveur ZONOS2 local
#   docker compose --profile omnivoice ... up          ajoute le serveur OmniVoice local
#
# Sans GPU, Piper et Kokoro tournent sur processeur ; XTTS, Voxtral et ZONOS2 en réclament un.
# Les réglages (modèle de langage, clés, licence XTTS) viennent du fichier .env : copiez
# .env.example et adaptez-le.

x-common: &common
  # Sans cela, tout ce que les conteneurs écrivent dans ./data appartient à root sur
  # l'hôte, et n'est ni modifiable ni supprimable sans sudo.
  user: "${UID:-1000}:${GID:-1000}"
  env_file:
    - path: .env
      required: false
  environment:
    VOXLIBRIS_DATA: /data
  volumes:
    # Les projets restent sur l'hôte, dans ./data ou le dossier de votre choix.
    - ${VOXLIBRIS_DATA_DIR:-./data}:/data
  # Un Ollama installé sur la machine se joint par host.docker.internal.
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  web:
    <<: *common
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: ghcr.io/ralphi2811/voxlibris-web:latest
    ports:
      - "${VOXLIBRIS_PORT:-8000}:8000"
    depends_on:
      - worker

  worker:
    <<: *common
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: ghcr.io/ralphi2811/voxlibris-worker:latest
    volumes:
      - ${VOXLIBRIS_DATA_DIR:-./data}:/data
      # Les poids pèsent des gigaoctets : un volume nommé leur évite d'être
      # retéléchargés à chaque reconstruction de l'image.
      - models:/models
    environment:
      VOXLIBRIS_DATA: /data
      # « cuda » quand la surcharge GPU est chargée, « cpu » sinon.
      VOXLIBRIS_DEVICE: ${VOXLIBRIS_DEVICE:-cpu}
      # Le relais ci-dessous ; vide, l'atelier ne réveille ni n'endort aucun serveur.
      VOXLIBRIS_DOCKER_URL: ${VOXLIBRIS_DOCKER_URL:-http://docker-proxy:2375}

  # Le concierge de la carte graphique (src/voxlibris/concierge.py) parle à Docker par
  # ce relais : lister les conteneurs du projet, en démarrer un, en arrêter un — et rien
  # d'autre, là où la socket brute vaudrait root sur la machine. Les règles sont les
  # nôtres, docker/docker-proxy.cfg, quatre requêtes autorisées. Grâce à lui, déclarez
  # tous les profils que vous voulez : l'atelier réveille le serveur qu'une tâche
  # demande, endort ceux qui ne tiendraient pas à côté, rend la carte après un quart
  # d'heure sans rien faire (réglable dans les Réglages).
  docker-proxy:
    image: haproxy:3.2-alpine
    # La socket appartient à root : le relais tourne sous root, dans son seul conteneur,
    # sans rien d'autre que ces quatre règles à exécuter.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/docker-proxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped

  # Voxtral TTS chez vous. Facultatif — profil « voxtral » — et exigeant : 16 Go de
  # mémoire vidéo, 8 Go de poids, un jeton Hugging Face (HF_TOKEN dans le .env) dont
  # le compte a accepté la licence. Puis, dans le .env :
  #   VOXLIBRIS_MISTRAL_BASE_URL=http://voxtral:8600/v1
  voxtral:
    profiles: ["voxtral"]
    build:
      context: .
      dockerfile: docker/voxtral.Dockerfile
    image: ghcr.io/ralphi2811/voxlibris-voxtral:latest
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      # Évite la compilation d'un noyau de tri au démarrage, qui réclame nvcc.
      VLLM_USE_FLASHINFER_SAMPLER: "0"
    volumes:
      - models:/models
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ZONOS2 (Zyphra) chez vous : clonage de voix à partir d'un simple extrait audio,
  # quarante langues, poids Apache 2.0. Facultatif — profil « zonos2 » — et gourmand :
  # 16 Go de poids, une carte de 24 Go ; il ne cohabite pas avec voxtral sur une seule
  # carte. Aucun jeton : le dépôt est ouvert. Puis, dans le .env :
  #   VOXLIBRIS_ZONOS2_BASE_URL=http://zonos2:1919
  # Les voix sont les fichiers audio de ./data/voices — déposés depuis la page Voix.
  zonos2:
    profiles: ["zonos2"]
    build:
      context: .
      dockerfile: docker/zonos2.Dockerfile
    image: ghcr.io/ralphi2811/voxlibris-zonos2:latest
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - path: .env
        required: false
    volumes:
      - models:/models
      - ${VOXLIBRIS_DATA_DIR:-./data}:/data
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # OmniVoice (k2-fsa) chez vous : clonage de voix lui aussi, des mêmes extraits, mais
  # léger — 0,8 milliard de paramètres, trois gigaoctets en lecture, il tient à côté de XTTS.
  # Six cents langues, poids Apache 2.0, dépôt ouvert. Facultatif — profil « omnivoice ».
  # Le serveur HTTP est le nôtre (docker/omnivoice-server.py). Puis, dans le .env :
  #   VOXLIBRIS_OMNIVOICE_BASE_URL=http://omnivoice:1920
  omnivoice:
    profiles: ["omnivoice"]
    build:
      context: .
      dockerfile: docker/omnivoice.Dockerfile
    image: ghcr.io/ralphi2811/voxlibris-omnivoice:latest
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - path: .env
        required: false
    volumes:
      - models:/models
      - ${VOXLIBRIS_DATA_DIR:-./data}:/data
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:
