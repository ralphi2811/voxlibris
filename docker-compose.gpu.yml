# Surcharge à empiler sur docker-compose.yml pour donner la carte NVIDIA à l'ouvrier.
# Séparée du fichier principal, sans quoi « docker compose up » échouerait sur toute
# machine dépourvue de nvidia-container-toolkit — alors que Piper et Kokoro y tournent
# très bien sur processeur.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
services:
  worker:
    environment:
      VOXLIBRIS_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
