# Voxtral (30 Go) et ZONOS2 (37 Go) : trop gros pour être sûrs de passer sur les machines
# de GitHub, dont le disque, même vidé de ses outils préinstallés, plafonne vers 50 Go.
# Lancées à la main, une à la fois ; si l'une échoue faute de place, l'image se
# construit sur place chez l'utilisateur, comme avant.
name: images-heavy

on:
  workflow_dispatch:
    inputs:
      image:
        description: image à construire
        type: choice
        options: [voxtral, zonos2]
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Faire toute la place possible
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/lib/jvm /usr/local/.ghcup /usr/share/miniconda /opt/az \
            /usr/local/julia* /usr/local/lib/node_modules /opt/microsoft
          sudo apt-get clean
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/voxlibris-${{ inputs.image }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ inputs.image }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/voxlibris-${{ inputs.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/voxlibris-${{ inputs.image }}:buildcache,mode=max
