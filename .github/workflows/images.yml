# Les cinq images de voxlibris, publiées sur ghcr.io — gratuit pour un dépôt public, comme
# les minutes de ces machines. Leur disque, une fois les outils préinstallés retirés,
# offre plus de cent gigaoctets : ZONOS2, 37 Go, y passe en un quart d'heure. Le cache de
# couches vit lui aussi sur ghcr.io, sans quoi PyTorch et vLLM se retéléchargeraient à
# chaque passage ; une image dont rien n'a changé n'est que ré-étiquetée.
name: images

on:
  push:
    branches: [main]
    paths:
      - docker/**
      - src/**
      - pyproject.toml
      - .dockerignore
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [web, worker, omnivoice, voxtral, zonos2]
    steps:
      - name: Faire de la place
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/lib/jvm /usr/local/.ghcup /usr/share/miniconda /opt/az \
            /usr/local/julia* /usr/local/lib/node_modules /opt/microsoft
          sudo apt-get clean
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/voxlibris-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/voxlibris-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/voxlibris-${{ matrix.image }}:buildcache,mode=max
