{#- Icônes en traits, sur une grille de 16 : elles se recolorent avec le texte. -#}
{% macro ic(name, size=16) -%}
<svg class="ic" width="{{ size }}" height="{{ size }}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "book" %}<path d="M3 3.5A1.5 1.5 0 0 1 4.5 2H13v11H4.5A1.5 1.5 0 0 0 3 14.5z"/><path d="M3 14.5V3.5"/><path d="M6 5h4"/>
{%- elif name == "list" %}<path d="M5 4h8M5 8h8M5 12h8M2.5 4h.5M2.5 8h.5M2.5 12h.5"/>
{%- elif name == "gear" %}<circle cx="8" cy="8" r="2.5"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/>
{%- elif name == "mic" %}<rect x="6" y="2" width="4" height="8" rx="2"/><path d="M4 8a4 4 0 0 0 8 0M8 12v2"/>
{%- elif name == "play" %}<path d="M5 3l8 5-8 5z"/>
{%- elif name == "check" %}<path d="M3 8.5l3 3 7-7"/>
{%- elif name == "x" %}<path d="M4 4l8 8M12 4l-8 8"/>
{%- elif name == "search" %}<circle cx="7" cy="7" r="4"/><path d="M10 10l4 4"/>
{%- elif name == "plus" %}<path d="M8 3v10M3 8h10"/>
{%- elif name == "download" %}<path d="M8 2v8M5 7l3 3 3-3M3 13h10"/>
{%- elif name == "upload" %}<path d="M8 12V4M5 7l3-3 3 3M3 13h10"/>
{%- elif name == "trash" %}<path d="M3 4h10M6 4V2h4v2M5 4l.7 9h4.6L11 4"/>
{%- elif name == "edit" %}<path d="M11 2l3 3-8 8H3v-3z"/>
{%- elif name == "merge" %}<path d="M8 2v6M4 6l4 4 4-4M8 10v4"/>
{%- elif name == "gpu" %}<rect x="2" y="4" width="12" height="8" rx="1.5"/><path d="M5 12v2M11 12v2M5 7h2M9 7h2"/>
{%- elif name == "warn" %}<path d="M8 2l6.5 11.5h-13z"/><path d="M8 6v3.5M8 12v.5"/>
{%- elif name == "image" %}<rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 11l4-4 3 3 2-2 3 3"/><circle cx="10.5" cy="6.5" r="1"/>
{%- elif name == "chev" %}<path d="M6 3l5 5-5 5"/>
{%- elif name == "back" %}<path d="M10 3L5 8l5 5"/>
{%- elif name == "clock" %}<circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/>
{%- elif name == "refresh" %}<path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5v3h-3"/>
{%- elif name == "sparkle" %}<path d="M8 2l1.5 4.5L14 8l-4.5 1.5L8 14l-1.5-4.5L2 8l4.5-1.5z"/>
{%- elif name == "stop" %}<rect x="4" y="4" width="8" height="8" rx="1"/>
{%- elif name == "ear" %}<path d="M4.5 7a3.5 3.5 0 0 1 7 0c0 2-1.5 2.5-1.5 4a1.5 1.5 0 0 1-3 0"/><path d="M6.5 7a1.5 1.5 0 0 1 3 0"/>
{%- endif %}
</svg>
{%- endmacro %}
