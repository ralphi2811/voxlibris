{% import "_icons.html" as icons %}
{% if job %}
<div class="job running">
  <span class="pulse"></span>
  <strong>{{ job.kind }}</strong>
  <span class="msg">{{ job.message or "démarrage…" }}</span>
  <span class="mono">{{ "%.0f"|format(job.running_for) }} s</span>
  <div class="bar"><i style="width: {{ (job.progress * 100)|round }}%"></i></div>
  <form method="post" action="/projects/{{ name }}/jobs/{{ job.id }}/cancel">
    <button class="btn sm danger" type="submit" title="s'arrête au prochain segment">{{ icons.ic("stop", 14) }}Arrêter</button>
  </form>
</div>
{% elif jobs and jobs[0].state == "échoué" %}
<div class="job failed">
  <strong>{{ jobs[0].kind }}</strong>
  <span class="msg">{{ jobs[0].message }}</span>
  <details><summary>journal</summary><pre>{{ jobs[0].log[-3000:] }}</pre></details>
</div>
{% endif %}
