[project]
name = "voxlibris"
version = "0.1.0"
description = "Transforme un livre — EPUB, PDF, scan — en livre audio chapitré, entièrement en local"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ralphi2811" }]
keywords = ["audiobook", "tts", "epub", "pdf", "ocr", "xtts", "m4b"]

# Le cœur n'embarque ni torch ni les moteurs TTS : l'ingestion, la normalisation et
# l'assemblage tournent sur une machine sans GPU, et seul le worker installe la pile
# lourde (voir l'extra « tts »). C'est ce qui permet une image web de quelques centaines
# de mégaoctets là où le worker en pèse huit.
dependencies = [
    "pymupdf>=1.24",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "num2words>=0.5.13",
    "pyspellchecker>=0.8",
    # Le contrôle qualité analyse les formes d'onde : il appartient au cœur, pas aux
    # moteurs, car c'est lui qui décide si un énoncé est à rejouer.
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Moteurs de synthèse. Installés uniquement dans l'image worker.
# Attention : les licences des modèles diffèrent, voir NOTICE.md.
tts = [
    "coqui-tts==0.27.5",
    "kokoro==0.9.4",
    "misaki[en]==0.9.4",
    "espeakng-loader",
    "phonemizer-fork",
    "piper-tts>=1.7",
    "soundfile>=0.12",
    "numpy>=1.26",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "arq>=0.26",
    "redis>=5.0",
]
ocr = ["pytesseract>=0.3.10", "pillow>=10.3"]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
voxlibris = "voxlibris.cli:app"

[project.urls]
Homepage = "https://github.com/ralphi2811/voxlibris"
Issues = "https://github.com/ralphi2811/voxlibris/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxlibris"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer déclare les options dans les valeurs par défaut : c'est son idiome, et B008
# le proscrit. La règle garde tout son sens partout ailleurs.
"src/voxlibris/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
