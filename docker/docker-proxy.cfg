# Règles du relais vers l'API de Docker, pour le concierge de la carte graphique.
#
# Montées dans le service « docker-proxy » du docker-compose.yml, un HAProxy nu. Le relais
# tout fait de la même veine (tecnativa/docker-socket-proxy) place son interdiction générale
# des écritures avant ses autorisations de démarrage et d'arrêt : ouvrir ces deux verbes y
# obligerait à ouvrir tous les autres, création de conteneur comprise, ce qui vaut root sur
# la machine. D'où ce fichier.
#
# Ici, quatre requêtes passent, tout le reste est refusé :
#   GET  /containers/json            lister les conteneurs, arrêtés compris
#   GET  /containers/<id>/json       lire les étiquettes du conteneur de l'atelier
#   POST /containers/<id>/start      réveiller un serveur
#   POST /containers/<id>/stop       l'endormir

global
    log stdout format raw daemon warning
    maxconn 64

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 10s
    timeout client 30s
    timeout server 60s
    timeout http-request 10s

backend dockerbackend
    server dockersocket /var/run/docker.sock

frontend dockerfrontend
    bind [::]:2375 v4v6
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/json$ }
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/json$ }
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/(start|stop)$ }
    http-request deny
    default_backend dockerbackend
